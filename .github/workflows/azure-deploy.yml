name: MLOps-DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: appphishing-cgdkcwgbhqfkcngt
  AZURE_RESOURCE_GROUP: phishingRG
  MODEL_ACCURACY_THRESHOLD: 0.60

jobs:
  # MLOps Job: Train and validate model
  mlops-train:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install scikit-learn pandas numpy joblib
    
    - name: Train phishing detection model
      run: |
        python model/train.py
    
    - name: Validate model accuracy
      run: |
        python -c "
import json
with open('model/metadata.json', 'r') as f:
    data = json.load(f)
accuracy = data.get('accuracy', 0)
print(f'Model Accuracy: {accuracy:.2%}')
assert accuracy >= 0.60, f'Accuracy {accuracy:.2%} below threshold'
print('✅ Model validation passed!')
"
    
    - name: Upload model artifact
      uses: actions/upload-artifact@v4
      with:
        name: phishing-model
        path: model/
        retention-days: 7

  # DevSecOps Job: Security scanning
  devsecops-scan:
    runs-on: ubuntu-latest
    needs: mlops-train
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download model artifact
      uses: actions/download-artifact@v4
      with:
        name: phishing-model
        path: model/
    
    - name: Run SAST scan
      run: |
        echo "🔍 Running Static Application Security Test"
        # Check for hardcoded secrets
        if grep -r "password\|secret\|key\|token" . --include="*.py" --exclude-dir=.git --exclude-dir=__pycache__; then
          echo "⚠️ WARNING: Possible secrets found in code"
        else
          echo "✅ No secrets detected"
        fi
    
    - name: Check for vulnerable dependencies
      run: |
        echo "📦 Checking dependencies"
        pip install safety
        safety check --full-report || echo "⚠️ Vulnerabilities found"
    
    - name: Scan Dockerfile if exists
      run: |
        if [ -f "Dockerfile" ]; then
          echo "🐳 Scanning Dockerfile"
          docker run --rm aquasec/trivy config Dockerfile || echo "⚠️ Issues found"
        fi

  # Deployment Job (only on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: [mlops-train, devsecops-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download model artifact
      uses: actions/download-artifact@v4
      with:
        name: phishing-model
        path: model/
    
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    
    - name: Wait for deployment
      run: sleep 30
    
    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests"
        curl -f https://${{ env.AZURE_WEBAPP_NAME }}.eastus-01.azurewebsites.net/health || exit 1
        curl -f https://${{ env.AZURE_WEBAPP_NAME }}.eastus-01.azurewebsites.net/metrics || exit 1
        echo "✅ Deployment successful"
    
    - name: Logout Azure
      run: az logout

  # MLOps Feedback Loop Monitoring
  mlops-monitor:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Monitor model performance
      run: |
        echo "📊 Monitoring model performance"
        curl -s https://${{ env.AZURE_WEBAPP_NAME }}.eastus-01.azurewebsites.net/metrics | jq '.' || echo "Metrics endpoint available"
