name: Secure AI Pipeline - MLOps plus DevSecOps

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  MODEL_ACCURACY_THRESHOLD: 0.70

jobs:
  # MLOps: Model Training and Validation
  mlops-train:
    name: MLOps - Train and Validate Model
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8
    
    - name: Lint code
      run: flake8 model/ api/ --max-line-length=120 --ignore=E501,F541
    
    - name: Run unit tests
      run: pytest tests/ -v || true
    
    - name: Train phishing detection model
      id: train
      run: |
        python model/train.py
        echo "model_version=$(cat model/metadata.json | python -c "import sys, json; print(json.load(sys.stdin)['model_version'])")" >> $GITHUB_OUTPUT
    
    - name: Upload model artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: |
          model/phishing_model.pkl
          model/vectorizer.pkl
          model/metadata.json
        retention-days: 7

  # DevSecOps: Security Gates
  devsecops-security:
    name: DevSecOps - Security Validation Gates
    runs-on: ubuntu-latest
    needs: [mlops-train]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download trained model
      uses: actions/download-artifact@v4
      with:
        name: trained-model
        path: model/
    
    - name: Run model security validation
      id: validate
      run: |
        python model/validate.py
        if [ $? -ne 0 ]; then
          echo "Model validation FAILED"
          exit 1
        fi
    
    - name: Scan for hardcoded secrets
      run: |
        echo "Scanning for secrets..."
        if grep -r "AKIA[0-9A-Z]\{16\}" . --exclude-dir=.git 2>/dev/null; then
          echo "AWS keys found!"
          exit 1
        fi
        if grep -r "-----BEGIN PRIVATE KEY-----" . 2>/dev/null; then
          echo "Private keys found!"
          exit 1
        fi
        echo "No secrets detected"
    
    - name: Run dependency vulnerability scan
      run: |
        pip install safety
        safety check --full-report || true
    
    - name: Build Docker image
      run: |
        docker build -t phishing-detector:latest -f api/Dockerfile .
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: phishing-detector:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload security scan results
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results.sarif

  # Deployment Gate
  deployment:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [mlops-train, devsecops-security]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Download trained model
      uses: actions/download-artifact@v4
      with:
        name: trained-model
        path: model/
    
    - name: Deploy to Azure Web App
      run: |
        echo "Deploying model version: $(cat model/metadata.json | python -c "import sys, json; print(json.load(sys.stdin)['model_version'])")"
        # Add your Azure deployment commands here
    
    - name: Run smoke tests
      run: |
        echo "Deployment successful"

  # Feedback Retraining Trigger
  feedback-trigger:
    name: Check if retraining needed
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Check feedback log size
      run: |
        if [ -f feedback_log.json ]; then
          SAMPLES=$(wc -l < feedback_log.json)
          if [ $SAMPLES -gt 50 ]; then
            echo "$SAMPLES feedback samples collected - Triggering retraining"
          fi
        fi
